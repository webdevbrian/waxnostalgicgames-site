  <script>
    // Each post links here with ?c=<campaign> (bsky-1117, yt-1117…): phones go straight to their store
    // with the campaign attached, so the stores' analytics say which post brought the install.
    (function () {
      var q = new URLSearchParams(location.search);
      var c = (q.get('c') || 'site').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 30) || 'site';
      var src = c.split('-')[0];
      var ios = 'https://apps.apple.com/app/id6817545940?pt=528711&ct=' + c + '&mt=8';
      var play = 'https://play.google.com/store/apps/details?id=com.webdevbrian.skipthestone&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=social&utm_campaign=' + c);
      window.__stores = { ios: ios, play: play };
      var ua = navigator.userAgent;
      var apple = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (apple) location.replace(ios);
      else if (/Android/.test(ua)) location.replace(play);
    })();
  </script>
